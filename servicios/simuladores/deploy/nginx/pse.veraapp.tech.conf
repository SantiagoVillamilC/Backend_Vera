server {
    listen 80;
    server_name pse.veraapp.tech;

    # 50-certbot.sh reemplaza este bloque por el de TLS. Conserva estos encabezados.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # nginx corre en un contenedor de la red centinela y resuelve por DNS de Docker.
    resolver 127.0.0.11 valid=10s;
    set $pse http://simulador-pse:8090;

    location = /pse {
        proxy_pass $pse;
    }

    location = /pse/autorizar {
        limit_except POST { deny all; }
        proxy_pass $pse;
    }

    location = /pse/cancelar {
        limit_except POST { deny all; }
        proxy_pass $pse;
    }

    location / {
        return 404;
    }
}
