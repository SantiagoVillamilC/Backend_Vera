  /v1/destinatarios:
    get:
      operationId: consultarDestinatario
      summary: Consulta el nombre visible de un destinatario interno por celular.
      description: HU-NF-06 C15.1 a C15.4. Usa el celular verificado y respeta el enfriamiento tras cambio de numero. Limite por usuario configurable con DESTINATARIOS_LIMITE y DESTINATARIOS_VENTANA.
      tags: [nucleo]
      parameters:
        - name: celular
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Nombre visible del destinatario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinatarioResponse"
              example: {success: true, data: {nombre: "Laura R."}, error: null, meta: null}
        "400":
          description: Falta el celular.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: BadRequest, message: "A required parameter is missing.", details: [{field: celular, rule: required}]}, meta: null}
        "401":
          description: Sesion ausente o invalida.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: Unauthorized, message: "Missing or invalid token."}, meta: null}
        "404":
          description: Celular no resuelto, incluso durante el enfriamiento.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: RecipientNotFound, message: "The destination does not exist."}, meta: null}
        "422":
          description: El celular pertenece al usuario autenticado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: SelfTransferNotAllowed, message: "You cannot send money to yourself."}, meta: null}
        "429":
          description: Limite de consultas por usuario excedido.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: TooManyRequests, message: "Too many recipient lookups."}, meta: null}
        "500":
          $ref: "#/components/responses/Error"
        "503":
          description: No se pudo verificar la sesion o contar la consulta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: AuthUnavailable, message: "Recipient lookup is temporarily unavailable."}, meta: null}
        "504":
          $ref: "#/components/responses/Error"

