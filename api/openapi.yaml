  /v1/vera/acciones/{id}/confirmar:
    post:
      operationId: confirmarAccionVera
      summary: Confirma y ejecuta una accion pendiente.
      description: >
        Si la accion no esta pendiente responde 409 ActionNotPending. Si supero su vigencia
        responde 410 ActionExpired. Si el monto o el dispositivo exigen codigo y no viene
        valido, responde 403 SecondFactorRequired. Un 403 ConsentRequired ademas cancela la
        accion, asi que el cliente debe refrescar la tarjeta al recibirlo.
      tags: [asistente]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarAccionVeraRequest"
      responses:
        "200":
          description: Accion resuelta con su estado y la transferencia.
          content:
