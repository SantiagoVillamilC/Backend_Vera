openapi: 3.0.3
info:
  title: Centinela API
  version: 1.0.0
  description: |
    Contrato del modulo de autenticacion. Es la fuente para el cliente Flutter y para los
    handlers generados con oapi-codegen. Toda respuesta usa el envelope
    {success, data, error, meta}. El codigo de error viaja en PascalCase. El detalle de
    comportamiento vive en las historias de autenticacion y el porqué de cada decisión en el
    dossier de diseño.

servers:
  - url: /
    description: El host y el esquema los fija el despliegue.

security:
  - bearerAuth: []

tags:
  - name: public
    description: Operacion sin token. Se registra a mano y no se genera.
  - name: registro
    description: Alta de persona y de empresa.
  - name: login
    description: Inicio de sesion y su segundo factor.
  - name: sesion
    description: Renovacion, cierre y dispositivos.
  - name: contexto
    description: Contexto personal o de empresa.
  - name: recuperacion
    description: Recuperacion de acceso.
  - name: cambio-numero
    description: Cambio del celular verificado.
  - name: kyc
    description: Niveles de producto y verificacion.
  - name: consentimiento
    description: Autorizacion de datos y opt-in.
  - name: nucleo
    description: Saldo, movimientos, depositos y transferencias del nucleo financiero.
  - name: custodio
    description: >
      Confirmacion del custodio simulado. Se excluye de la generacion (ver exclude-tags en
      oapi-codegen.yaml) porque usa un token estatico, no el bearerAuth de un usuario.

paths:
  /v1/auth/register:
    post:
      operationId: register
      summary: Registra una persona natural o una empresa.
      tags: [public, registro]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Cuenta creada en estado pendiente de verificacion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/register/verify-phone:
    post:
      operationId: verifyPhone
      summary: Verifica el celular y activa la cuenta.
      tags: [public, registro]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPhoneRequest"
      responses:
        "200":
          description: Celular verificado y cuenta activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificacionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/otp/resend:
    post:
      operationId: resendOtp
      summary: Reenvia el codigo de un desafio vigente.
      description: >
        El reenvio comparte con recovery/request el cupo de 5 codigos por hora por cuenta.
        Ademas aplica una espera creciente entre envios. Al agotar el cupo responde 429
        TooManyRequests y, si se pide antes de que termine la espera, 429 OtpResendCooldown.
      tags: [public, login]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendOtpRequest"
      responses:
        "200":
          description: Codigo reenviado sobre el mismo desafio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioResponse"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/login:
    post:
      operationId: login
      summary: Valida el celular y la contrasena y emite el par de tokens.
      tags: [public, login]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Par de tokens y usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rota el refresh y entrega un access nuevo.
      description: >
        El access token vive 5 minutos. Cuando vence, el cliente lo renueva con este
        endpoint presentando el refresh token. Cada llamada rota el refresh: el anterior
        queda invalido y la respuesta trae el par nuevo. Reusar un refresh ya rotado,
        fuera de la ventana de gracia, responde 401 RefreshReused y revoca la familia.
      tags: [public, sesion]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Par de tokens rotado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/recovery/request:
    post:
      operationId: recoveryRequest
      summary: Inicia la recuperacion. Responde igual exista o no la cuenta.
      description: >
        Comparte con otp/resend el cupo de 5 codigos por hora por cuenta, con espera
        creciente entre envios. Al agotar el cupo responde 429 TooManyRequests. Con cupo
        disponible la respuesta es la misma exista o no la cuenta.
      tags: [public, recuperacion]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequest"
      responses:
        "202":
          description: Respuesta generica con un desafio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioResponse"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/recovery/verify:
    post:
      operationId: recoveryVerify
      summary: Verifica el codigo y el segundo metodo, y entrega el token de restablecimiento.
      tags: [public, recuperacion]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryVerifyRequest"
      responses:
        "200":
          description: Token de restablecimiento de vida corta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/recovery/reset:
    post:
      operationId: recoveryReset
      summary: Fija la contrasena nueva. No emite sesion.
      tags: [public, recuperacion]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryResetRequest"
      responses:
        "200":
          description: Contrasena restablecida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoca la sesion del refresh presentado.
      tags: [sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Sesion cerrada.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoca todos los refresh del usuario.
      tags: [sesion]
      responses:
        "204":
          description: Todas las sesiones cerradas.
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/sessions:
    get:
      operationId: listSessions
      summary: Lista los dispositivos activos.
      tags: [sesion]
      responses:
        "200":
          description: Sesiones del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/sessions/{session_id}:
    delete:
      operationId: deleteSession
      summary: Revoca una sesion.
      tags: [sesion]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Sesion revocada.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/contextos:
    get:
      operationId: listContextos
      summary: Lista los contextos del usuario.
      tags: [contexto]
      responses:
        "200":
          description: Contexto personal y empresas con rol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextosResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/contexto:
    post:
      operationId: setContexto
      summary: Emite un access con el contexto elegido.
      tags: [contexto]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextoRequest"
      responses:
        "200":
          description: Access con el contexto y el rol.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextoActivoResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/companies:
    post:
      operationId: createCompany
      summary: Crea la empresa de la persona autenticada.
      tags: [contexto]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearEmpresaRequest"
      responses:
        "201":
          description: Empresa creada y vinculada al representante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaCreadaResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/phone/change/request:
    post:
      operationId: phoneChangeRequest
      summary: Inicia el cambio de numero verificando el nuevo.
      tags: [cambio-numero]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneChangeRequest"
      responses:
        "200":
          description: Codigo enviado al numero nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesafioResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/phone/change/confirm:
    post:
      operationId: phoneChangeConfirm
      summary: Confirma el cambio y notifica al numero viejo.
      tags: [cambio-numero]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Numero cambiado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/kyc/estado:
    get:
      operationId: kycEstado
      summary: Consulta el producto, el estado de KYC y los limites.
      tags: [kyc]
      responses:
        "200":
          description: Estado de KYC del usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycEstadoResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/kyc/verificacion:
    post:
      operationId: kycVerificacion
      summary: Inicia o completa la verificacion del nivel solicitado.
      tags: [kyc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycVerificacionRequest"
      responses:
        "200":
          description: Verificacion registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/auth/consents:
    get:
      operationId: listConsents
      summary: Lista los consentimientos del usuario.
      tags: [consentimiento]
      responses:
        "200":
          description: Consentimientos con su version y fecha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    post:
      operationId: createConsent
      summary: Registra un consentimiento.
      tags: [consentimiento]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Consentimiento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/saldo:
    get:
      operationId: saldo
      summary: Consulta el saldo disponible del usuario autenticado.
      tags: [nucleo]
      responses:
        "200":
          description: Monto disponible, la moneda y el instante del calculo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/transferencias/maximo:
    get:
      operationId: montoMaximo
      summary: Consulta el monto maximo que el usuario puede enviar sin quedarse sin saldo por el GMF.
      tags: [nucleo]
      responses:
        "200":
          description: Monto maximo enviable, la moneda y el instante del calculo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MontoMaximoResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/movimientos:
    get:
      operationId: movimientos
      summary: Lista una pagina del historial del usuario autenticado, del movimiento mas nuevo al mas viejo.
      tags: [nucleo]
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            Tamano de pagina, de 1 a 100. Por defecto 50. El handler recorta a 100 un valor
            mayor, no lo rechaza. Se tipa x-go-type string para que un valor no numerico
            llegue al handler y salga como ValidationError, en vez de fallar antes en el
            binding generado como BadRequest.
          schema:
            type: integer
            x-go-type: string
        - name: cursor
          in: query
          required: false
          description: >
            Ancla del ultimo movimiento de la pagina anterior. Mismo motivo de x-go-type
            string que limit.
          schema:
            type: integer
            format: int64
            x-go-type: string
      responses:
        "200":
          description: Pagina de movimientos, del mas nuevo al mas viejo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientosResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/depositos:
    post:
      operationId: crearDeposito
      summary: Crea una intencion de deposito o devuelve la ya guardada para la misma clave de idempotencia.
      tags: [nucleo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearDepositoRequest"
      responses:
        "200":
          description: Intencion ya existente para la misma clave de idempotencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositoConPagoResponse"
        "201":
          description: Intencion de deposito creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositoConPagoResponse"
              example:
                success: true
                data:
                  id: "123e4567-e89b-42d3-a456-426614174000"
                  referencia: "dep-123e4567-e89b-42d3-a456-426614174000"
                  monto: "150000"
                  moneda: COP
                  estado: pendiente
                  creada_en: "2026-10-02T10:00:00Z"
                  url_pago: "https://pse.veraapp.tech/pse?referencia=dep-123e4567-e89b-42d3-a456-426614174000&monto=150000"
                error: null
                meta: null
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/depositos/{id}:
    get:
      operationId: deposito
      summary: Consulta el estado actual de una intencion de deposito del usuario autenticado.
      tags: [nucleo]
      parameters:
        - name: id
          in: path
          required: true
          description: >
            Se declara como texto simple, no como uuid con formato: un id malformado debe
            seguir cayendo en el 404 NotFound que ya escribe el handler, no fallar antes en
            el binding generado.
          schema:
            type: string
      responses:
        "200":
          description: Intencion de deposito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositoResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/destinatarios:
    get:
      operationId: consultarDestinatario
      summary: Consulta el nombre visible de un destinatario interno por celular.
      description: HU-NF-06 C15.1 a C15.4. Usa el celular verificado y respeta el enfriamiento tras cambio de numero. Limite por usuario configurable con DESTINATARIOS_LIMITE y DESTINATARIOS_VENTANA.
      tags: [nucleo]
      parameters:
        - name: celular
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Nombre visible del destinatario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinatarioResponse"
              example: {success: true, data: {nombre: "Laura R."}, error: null, meta: null}
        "400":
          description: Falta el celular.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: BadRequest, message: "A required parameter is missing.", details: [{field: celular, rule: required}]}, meta: null}
        "401":
          description: Sesion ausente o invalida.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: Unauthorized, message: "Missing or invalid token."}, meta: null}
        "404":
          description: Celular no resuelto, incluso durante el enfriamiento.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: RecipientNotFound, message: "The destination does not exist."}, meta: null}
        "422":
          description: El celular pertenece al usuario autenticado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: SelfTransferNotAllowed, message: "You cannot send money to yourself."}, meta: null}
        "429":
          description: Limite de consultas por usuario excedido.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: TooManyRequests, message: "Too many recipient lookups."}, meta: null}
        "500":
          $ref: "#/components/responses/Error"
        "503":
          description: No se pudo verificar la sesion o contar la consulta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
              example: {success: false, data: null, error: {code: AuthUnavailable, message: "Recipient lookup is temporarily unavailable."}, meta: null}
        "504":
          $ref: "#/components/responses/Error"

  /v1/transferencias:
    post:
      operationId: transferir
      summary: Envia dinero a otro usuario o devuelve el envio ya guardado para la misma clave de idempotencia.
      tags: [nucleo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTransferenciaRequest"
      responses:
        "200":
          description: Envio ya existente para la misma clave de idempotencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferenciaResponse"
        "201":
          description: Envio creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferenciaResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/transferencias/interbancarias:
    post:
      operationId: transferirInterbancaria
      summary: Envia dinero por llave a otra entidad o devuelve el envio ya guardado para la misma clave de idempotencia.
      tags: [nucleo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTransferenciaInterbancariaRequest"
      responses:
        "200":
          description: Envio ya existente para la misma clave de idempotencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvioPorLlaveResponse"
        "201":
          description: Envio creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvioPorLlaveResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/depositos/confirmaciones:
    post:
      operationId: confirmarDeposito
      summary: Recibe la senal del custodio simulado sobre una intencion pendiente y la confirma o la rechaza.
      description: >
        Se cuelga a mano bajo RequireCustodio en el router, nunca bajo RequireAuth: usa el
        token estatico del custodio simulado, no un JWT de usuario. El tag custodio esta
        excluido de la generacion para que este metodo no aparezca en el ServerInterface ni
        herede bearerAuth por estar dentro de servidorV1.
      tags: [custodio]
      security:
        - custodioAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmarDepositoRequest"
      responses:
        "200":
          description: Intencion confirmada o rechazada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositoResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    custodioAuth:
      type: http
      scheme: bearer
      description: >
        Token estatico del custodio simulado (RequireCustodio), no un JWT de usuario. Distinto
        de bearerAuth.

  responses:
    Error:
      description: Envelope de error. Misma forma en cualquier status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Identificador estable del catalogo de errores, en PascalCase. Nunca se compara el
            mensaje. Catalogo:
            BadRequest (JSON malformado), ValidationError (regla incumplida, con details),
            Unauthorized (access vencido o alterado), InvalidCredentials, AccountSuspended,
            AccountClosed, OtpInvalid, OtpExpired, ChallengeInvalid, OtpTooManyAttempts,
            OtpResendCooldown, RefreshInvalid, RefreshReused, SessionNotFound, NoCompanyRole,
            ContextInvalid, ResetInvalid, SecondFactorRequired, KycRequired, ConsentRequired,
            DuplicateIdentifier, PhoneUnverified, OtpTooManyResends, PhoneChangeCooldown,
            TooManyRequests, NotImplemented, PayloadTooLarge (cuerpo mayor a 1 MiB),
            RecipientNotFound (404, destino interno inexistente),
            SelfTransferNotAllowed (422, destino interno propio),
            MethodNotAllowed (metodo no permitido), NotFound (recurso inexistente),
            AuthUnavailable (fail closed de Redis o del canal),
            OtpDeliveryFailed (el canal no entrego el codigo), Timeout (504),
            WhatsappUnicoCanal (409, revocar el opt-in de WhatsApp mientras sea el unico canal del OTP),
            TargetNotAllowed (400, el saldo y el maximo solo responden por el usuario autenticado),
            InsufficientFunds (422, saldo insuficiente), OperationLimitExceeded (422, el monto
            supera el tope por operacion de un saldo bajo), MonthlyQuotaExceeded (422, cupo
            mensual agotado), IdempotencyConflict (409, la clave de idempotencia se reuso con
            otra peticion), DirectoryUnavailable (503, el directorio de llaves no responde),
            DepositNotFound (404, la confirmacion del custodio apunta a un deposito inexistente),
            ConfirmationConflict (409, la confirmacion no coincide con el deposito),
            LateConfirmation (409, el deposito ya no esta pendiente),
            NotReady (503, solo en GET /readyz cuando una dependencia no responde),
            InternalError (siempre generico). Los identificadores InvalidEmail, InvalidPhone,
            InvalidName, WeakPassword e InvalidNit ya no existen: los reemplaza
            ValidationError con details[{field, rule, param}].
          example: InvalidCredentials
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, rule]
      properties:
        field:
          type: string
          description: Nombre del campo en snake_case, con la ruta anidada si aplica.
        rule:
          type: string
        param:
          type: string

    Meta:
      type: object
      nullable: true
      required: [limit, next_cursor, has_more]
      properties:
        limit:
          type: integer
        next_cursor:
          type: integer
          format: int64
          nullable: true
        has_more:
          type: boolean

    ErrorResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          type: object
          nullable: true
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"

    OkData:
      type: object
      properties:
        mensaje:
          type: string

    OkResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/OkData"
        error:
          type: object
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    Desafio:
      type: object
      required: [challenge_id, expira_en_segundos, proposito]
      properties:
        challenge_id:
          type: string
          format: uuid
        expira_en_segundos:
          type: integer
          example: 300
        proposito:
          type: string
          enum: [registro, login, recuperacion, cambio_numero, cambio_numero_viejo]
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=registro login recuperacion cambio_numero cambio_numero_viejo"

    DesafioResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Desafio"
        error:
          type: object
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    Consentimiento:
      type: object
      required: [tipo, version_texto, aceptado]
      description: >
        Consentimiento que acompana al registro. En el alta de persona y de empresa son
        obligatorios y deben venir aceptados (aceptado en true) tratamiento_datos y
        whatsapp_optin, con la version de texto v1. Si falta alguno, viene sin aceptar o
        trae una version inexistente, el registro responde 403 ConsentRequired. biometricos
        es opcional.
      properties:
        tipo:
          type: string
          enum: [tratamiento_datos, whatsapp_optin, biometricos]
          description: >
            Tipo de consentimiento. tratamiento_datos y whatsapp_optin son obligatorios en el
            registro, biometricos es opcional.
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=tratamiento_datos whatsapp_optin biometricos"
        version_texto:
          type: string
          description: >
            Version del texto legal que la persona acepto. La version valida hoy es v1 para
            los tres tipos.
          x-oapi-codegen-extra-tags:
            validate: "required,max=64"
        aceptado:
          type: boolean
          x-go-type: "*bool"
          x-oapi-codegen-extra-tags:
            validate: "required"

    RegisterPersonaRequest:
      type: object
      required: [tipo_cuenta, correo, contrasena, celular, nombre_completo, tipo_documento, numero_documento, consentimientos]
      properties:
        tipo_cuenta:
          type: string
          enum: [persona]
        correo:
          type: string
          format: email
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
        contrasena:
          type: string
          minLength: 8
          maxLength: 64
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=8,max=64"
        celular:
          type: string
          description: >
            Celular en formato E.164, validado con libphonenumber. Un numero con forma E.164
            pero inexistente, por ejemplo +573061234567 (prefijos 306 a 308), responde 422
            con la regla e164.
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,e164"
        nombre_completo:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,max=200"
        tipo_documento:
          type: string
          enum: [CC, CE, PA]
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=CC CE PA"
        numero_documento:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        consentimientos:
          type: array
          minItems: 1
          description: >
            Obligatorios tratamiento_datos y whatsapp_optin, ambos aceptados y con version_texto
            v1. Sin ellos el registro responde 403 ConsentRequired.
          items:
            $ref: "#/components/schemas/Consentimiento"
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,dive"

    RepresentanteLegal:
      type: object
      required: [nombre_completo, tipo_documento, numero_documento]
      properties:
        nombre_completo:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,max=200"
        tipo_documento:
          type: string
          enum: [CC, CE, PA]
          x-oapi-codegen-extra-tags:
            validate: "required,oneof=CC CE PA"
        numero_documento:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"

    RegisterEmpresaRequest:
      type: object
      required: [tipo_cuenta, razon_social, nit, correo, contrasena, celular, representante_legal, consentimientos]
      properties:
        tipo_cuenta:
          type: string
          enum: [empresa]
        razon_social:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,max=200"
        nit:
          type: string
          description: >
            NIT colombiano. Se valida el digito de verificacion DIAN (modulo 11). Acepta
            puntos, guion y espacios, que se ignoran, y un NIT con digito incorrecto responde
            422 con la regla nit.
          x-oapi-codegen-extra-tags:
            validate: "required,nit"
        correo:
          type: string
          format: email
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,email"
        contrasena:
          type: string
          minLength: 8
          maxLength: 64
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,min=8,max=64"
        celular:
          type: string
          description: >
            Celular del representante legal, ancla del OTP. Formato E.164 validado con
            libphonenumber. Un numero con forma E.164 pero inexistente, por ejemplo
            +573061234567 (prefijos 306 a 308), responde 422 con la regla e164.
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,e164"
        representante_legal:
          $ref: "#/components/schemas/RepresentanteLegal"
        consentimientos:
          type: array
          minItems: 1
          description: >
            Obligatorios tratamiento_datos y whatsapp_optin, ambos aceptados y con version_texto
            v1. Sin ellos el registro responde 403 ConsentRequired.
          items:
            $ref: "#/components/schemas/Consentimiento"
          x-oapi-codegen-extra-tags:
            validate: "required,min=1,dive"

    RegisterRequest:
      oneOf:
        - $ref: "#/components/schemas/RegisterPersonaRequest"
        - $ref: "#/components/schemas/RegisterEmpresaRequest"
      discriminator:
        propertyName: tipo_cuenta
        mapping:
          persona: "#/components/schemas/RegisterPersonaRequest"
          empresa: "#/components/schemas/RegisterEmpresaRequest"

    Registro:
      type: object
      required: [id, tipo_cuenta, correo, celular, estado, fecha_creacion, desafio]
      properties:
        id:
          type: string
          format: uuid
        empresa_id:
          type: string
          format: uuid
        tipo_cuenta:
          type: string
          enum: [persona, empresa]
        correo:
          type: string
        celular:
          type: string
        estado:
          type: string
          enum: [pendiente_verificacion, activo, suspendido, cerrado]
        fecha_creacion:
          type: string
          format: date-time
        nombre_completo:
          type: string
        razon_social:
          type: string
        nit:
          type: string
        desafio:
          $ref: "#/components/schemas/Desafio"

    RegistroResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Registro"
        error:
          type: object
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    VerifyPhoneRequest:
      type: object
      required: [celular, codigo]
      properties:
        celular:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required,e164"
        codigo:
          type: string
          pattern: "^[0-9]{6}$"
          x-oapi-codegen-extra-tags:
            validate: "required,len=6,number"

    VerifyOtpRequest:
      type: object
      required: [challenge_id, codigo]
      properties:
        challenge_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            validate: "required"
        codigo:
          type: string
          pattern: "^[0-9]{6}$"
          x-oapi-codegen-extra-tags:
            validate: "required,len=6,number"

    ResendOtpRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          format: uuid
          x-oapi-codegen-extra-tags:
            validate: "required"

    Verificacion:
      type: object
      required: [id, celular, estado]
      properties:
        id:
          type: string
          format: uuid
        celular:
          type: string
        estado:
          type: string
          enum: [pendiente_verificacion, activo, suspendido, cerrado]
        codigos_respaldo:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
          description: Codigos de respaldo de un solo uso, presentes solo en la activacion.

    VerificacionResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Verificacion"
        error:
          type: object
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    LoginRequest:
      type: object
      required: [celular, contrasena]
      properties:
        celular:
          type: string
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required,e164"
        contrasena:
          type: string
          x-go-type: string
          x-oapi-codegen-extra-tags:
            validate: "required"
        contexto:
          type: string
          enum: [usuario, empresa]
          default: usuario
          x-oapi-codegen-extra-tags:
            validate: "omitempty,oneof=usuario empresa"

    Usuario:
      type: object
      required: [id, tipo_cuenta, correo, contexto_activo, rol_activo]
      properties:
        id:
          type: string
          format: uuid
        tipo_cuenta:
          type: string
          enum: [persona, empresa]
        correo:
          type: string
        nombre_completo:
          type: string
        razon_social:
          type: string
        contexto_activo:
          type: string
        rol_activo:
          type: string
          nullable: true

    Sesion:
      type: object
      required: [access_token, refresh_token, usuario]
      properties:
        access_token:
          type: string
          description: >
            JWT de acceso. Vive 5 minutos. Al vencer se renueva con el refresh en POST
            /v1/auth/refresh.
        refresh_token:
          type: string
          description: Token de renovacion. Cada uso en POST /v1/auth/refresh lo rota por uno nuevo.
        usuario:
          $ref: "#/components/schemas/Usuario"

    SesionResponse:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Sesion"
        error:
          type: object
          nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          x-oapi-codegen-extra-tags:
            validate: "required"

    Tokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          description: >
            JWT de acceso. Vive 5 minutos. Al vencer se renueva con el refresh en POST
            /v1/auth/refresh.
        refresh_token:
          type: string
          description: Refresh nuevo. El anterior queda invalido tras la rotacion.

    RefreshResponse:
      type: object
