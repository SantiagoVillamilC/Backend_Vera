                confirmada:
                  value:
                    success: true
                    data:
                      accion_pendiente:
                        id: "0a1b2c3d-0000-4000-8000-000000000009"
                        estado: "confirmada"
                        tipo: "transferencia_interna"
                        destinatario:
                          nombre: "Laura R."
                          celular_parcial: "******4321"
                        monto: "150000"
                        moneda: "COP"
                        requiere_codigo: true
                        expira_en: "2026-10-15T14:21:00-05:00"
                      transferencia:
                        id: "9c8b7a6d-0000-4000-8000-000000000010"
                        destino: "3001234321"
                        monto: "150000"
                        moneda: "COP"
                        estado: "confirmada"
                        creada_en: "2026-10-15T14:18:00-05:00"
                        actualizada_en: "2026-10-15T14:18:05-05:00"
                    error: null
                    meta: null
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: Falta el codigo de confirmacion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                second_factor_required:
                  value:
                    success: false
                    data: null
                    error:
                      code: "SecondFactorRequired"
                      message: "La operacion exige el codigo de confirmacion."
                    meta: null
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: La accion no esta pendiente ni confirmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                action_not_pending:
                  value:
                    success: false
                    data: null
                    error:
                      code: "ActionNotPending"
                      message: "La accion ya no esta pendiente."
                    meta: null
        "410":
          description: La accion supero su vigencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                action_expired:
                  value:
                    success: false
                    data: null
                    error:
                      code: "ActionExpired"
                      message: "La accion pendiente supero su vigencia."
                    meta: null
        "413":
          $ref: "#/components/responses/Error"
        "422":
          description: El saldo no alcanza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficient_funds:
                  value:
                    success: false
                    data: null
                    error:
                      code: "InsufficientFunds"
                      message: "Saldo insuficiente para la transferencia."
                    meta: null
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"

  /v1/vera/acciones/{id}/cancelar:
