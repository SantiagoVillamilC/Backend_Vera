services:
  simulador-riel:
    build:
      context: ../..
      dockerfile: infra/simulador-riel/Dockerfile
    restart: unless-stopped
    environment:
      SIMULADOR_RIEL_ADDR: "0.0.0.0"
      SIMULADOR_RIEL_PORT: "8098"
      SIMULADOR_RIEL_DB: /datos/simulador-riel.db
      SIMULADOR_RIEL_ORIGEN: simulador-riel
      SIMULADOR_RIEL_PERMITIR_EXPOSICION: "true"
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - datos-simulador-riel:/datos

volumes:
  datos-simulador-riel:
