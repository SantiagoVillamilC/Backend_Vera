services:
  simulador-custodia:
    build:
      context: ../..
      dockerfile: infra/simulador-custodia/Dockerfile
    restart: unless-stopped
    environment:
      SIMULADOR_CUSTODIA_ADDR: "0.0.0.0"
      SIMULADOR_CUSTODIA_PORT: "8099"
      SIMULADOR_CUSTODIA_DB: /datos/simulador-custodia.db
      SIMULADOR_CUSTODIA_ORIGEN: simulador-custodia
      SIMULADOR_CUSTODIA_PERMITIR_EXPOSICION: "true"
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - datos-simulador-custodia:/datos

volumes:
  datos-simulador-custodia:
