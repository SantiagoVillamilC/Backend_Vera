# infra/servidor/simuladores/pse-http.conf
# Cuerpo del vhost de PSE. 65-simuladores.sh lo copia a
# /opt/centinela/infra-servidor/nginx/snippets/pse-http.conf y lo incluyen los
# dos bloques de servidor que genera (uno en :80 y, cuando existe el
# certificado, otro en :443). Delimitadores sin interpolar: $host y
# $request_uri son variables de nginx, no de bash.

# Encabezados de proxy explícitos: sin ellos nginx manda el nombre del
# upstream como Host y el simulador no reconoce el origen.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# nginx corre en un contenedor de la red centinela y resuelve por DNS de Docker.
resolver 127.0.0.11 valid=10s;
set $pse http://simulador-pse:8090;

location = /pse {
    proxy_pass $pse;
}

location = /pse/autorizar {
    limit_except POST { deny all; }
    proxy_pass $pse;
}

location = /pse/cancelar {
    limit_except POST { deny all; }
    proxy_pass $pse;
}

location / {
    return 404;
}
