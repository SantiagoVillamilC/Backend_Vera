version: "2"
sql:
  # Repositorio de auth (SCRUM-52). No se toca.
  - engine: postgresql
    schema: bd/migraciones
    queries: bd/consultas
    gen:
      go:
        package: repositorio
        out: internal/repositorio
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        wrap_errors: true
  # Repositorio del núcleo financiero. Vive dentro de internal/nucleo para que el segundo
  # internal de Go impida que cualquier paquete de fuera importe su Querier.
  # El esquema del núcleo todavía no existe: lo crea NF-A1-01, que declara `schema` como la
  # lista de los archivos del núcleo dentro de bd/migraciones, nunca el directorio compartido.
  - engine: postgresql
    queries: bd/consultas-nucleo
    gen:
      go:
        package: repositorio
        out: internal/nucleo/internal/repositorio
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        wrap_errors: true
        rename:
          nucleo_cuentum: Cuenta
          nucleo_journal_entry: JournalEntry
          nucleo_posting: Posting
          nucleo_deposito: Deposito
          nucleo_extracto_custodio: ExtractoCustodio
          nucleo_transferencium: Transferencia
          nucleo_regla_limite: ReglaLimite
          nucleo_valor_uvt: ValorUvt
          nucleo_outbox: Outbox
  # Repositorio de auth (fase0-2): su propio esquema y su propio rol, sin el ledger del núcleo.
  - engine: postgresql
    schema:
      - bd/migraciones-auth
    queries: bd/consultas-auth
    gen:
      go:
        package: repositorio
        out: internal/auth/internal/repositorio
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        wrap_errors: true
        rename:
          auth_parte: Parte
          auth_persona: Persona
          auth_empresa: Empresa
          auth_roles_de_parte: RolDeParte
          auth_credenciale: Credencial
          auth_transiciones_credencial: TransicionCredencial
          auth_eventos_autenticacion: EventoAutenticacion
          auth_sesione: Sesion
          auth_outbox: AvisoOutbox
