version: "2"
sql:
  - engine: postgresql
    schema: bd/migraciones
    queries: bd/consultas
    gen:
      go:
        package: repositorio
        out: internal/repositorio
        sql_package: pgx/v5
        sql_driver: github.com/jackc/pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        wrap_errors: true
