name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      # El repositorio arrastra deuda de lint anterior a este workflow. Se revisa
      # solo lo que introduce cada cambio, contra la base del PR o el commit
      # anterior en un push, para no bloquear por hallazgos viejos.
      - name: Lint (only issues introduced by this change)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="HEAD~1"
          fi
          if git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            "$(go env GOPATH)/bin/golangci-lint" run --new-from-rev="$BASE_SHA"
          else
            echo "::warning::No hay revisión base para comparar, se omite el lint."
          fi

  # Las pruebas con el tag integration necesitan Postgres, Redis y el simulador de
  # custodia reales. Sin las variables correctas el helper hace t.Skip y el job
  # quedaría verde sin probar nada, por eso el último paso falla si aparece un
  # skip que no sea el helper de subproceso conocido. Los servicios son efímeros
  # y solo escuchan en el runner, y los secretos se generan aquí en cada corrida.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_DB: vera
          # Base efímera del runner sin contraseña literal en el repositorio.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owner -d vera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate secrets and environment
        run: |
          OWNER_PW="$(openssl rand -hex 32)"
          API_PW="$(openssl rand -hex 32)"
          echo "::add-mask::$OWNER_PW"
          echo "::add-mask::$API_PW"
          {
            echo "OWNER_PW=$OWNER_PW"
            echo "API_PW=$API_PW"
            echo "DATABASE_URL=postgres://owner:$OWNER_PW@127.0.0.1:5432/vera?sslmode=disable"
            echo "APP_DATABASE_URL=postgres://rol_api:$API_PW@127.0.0.1:5432/vera?sslmode=disable"
            echo "REDIS_URL=redis://127.0.0.1:6379"
          } >> "$GITHUB_ENV"

      - name: Run migrations and set role passwords
        run: |
          go run ./cmd/migrate up
          psql "postgres://owner@127.0.0.1:5432/vera?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE owner WITH PASSWORD '$OWNER_PW'" \
            -c "ALTER ROLE rol_api WITH PASSWORD '$API_PW'"

      # El simulador de custodia vive en el monorepo Simuladores_Vera. Sin
      # SIMULADOR_CUSTODIA_URL, las pruebas que lo necesitan se saltan solas.
      # -p 1 porque los paquetes comparten la misma base y varias pruebas escriben
      # tablas globales (ledger, outbox, UVT), así que en paralelo se pisarían.
      - name: Integration tests
        run: |
          set -o pipefail
          go test -json -tags integration -count=1 -p 1 ./... | tee "$RUNNER_TEMP/integration.json" \
            | python3 -c '
          import json, sys
          for linea in sys.stdin:
              try:
                  e = json.loads(linea)
              except ValueError:
                  print(linea, end="")
                  continue
              if e.get("Action") == "output":
                  print(e.get("Output", ""), end="")
          '

      # Un skip en un paquete con pruebas de integración casi siempre es una
      # variable de entorno mal puesta. Solo se permite el helper de subproceso,
      # que corre dentro de otra prueba y se omite por diseño en la corrida directa.
      - name: Fail on unexpected skips
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          permitidos = {"TestProcesoQueMuereEnElDespacho"}
          inesperados = []
          with open(os.path.join(os.environ["RUNNER_TEMP"], "integration.json")) as f:
              for linea in f:
                  try:
                      e = json.loads(linea)
                  except ValueError:
                      continue
                  if e.get("Action") == "skip" and e.get("Test") and e["Test"] not in permitidos:
                      inesperados.append(e["Package"] + " " + e["Test"])
          if inesperados:
              print("Pruebas omitidas sin explicación:")
              print("\n".join(inesperados))
              raise SystemExit(1)
          PY
