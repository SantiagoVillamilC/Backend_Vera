version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Sin target-branch, dependabot abre los PRs contra main, que es la rama
    # por defecto; el flujo del repo es dev -> staging -> main.
    target-branch: dev
    schedule:
      interval: weekly
    # Un solo PR por ecosistema: con siete abiertos a la vez, cada uno
    # arrastraba un go.sum viejo y había que rebasearlos de a uno. Las actions
    # se fijan por SHA en los workflows, así que el PR sigue siendo revisable.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 3
